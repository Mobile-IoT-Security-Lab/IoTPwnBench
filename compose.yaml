x-builder: &builder
  build: .
  image: ${YOCTO_BUILDER_IMAGE:-yocto-builder}:6.0.3
  environment: &builder-environment
    YOCTO_MACHINE: ${YOCTO_MACHINE:-qemuarm64}
    YOCTO_LAYERS: openembedded-core/meta meta-openembedded/meta-oe meta-router-dashboard
  volumes:
    # Downloads, sstate and hash equivalence database: keep between builds.
    - yocto-cache:/cache
    # Build directory: safe to delete, everything reusable is in yocto-cache.
    - yocto-build:/workdir
    - ./meta-router-dashboard:/opt/yocto/layers/meta-router-dashboard:ro
    - ./scripts:/scripts:ro
    - ./deploy-images:/export

services:
  # Build the firmware and export it to ./deploy-images.
  yocto:
    <<: *builder
    command: ["bash", "/scripts/container-build-and-export.sh"]

  # Fill the cache only: docker compose --profile warm run --rm warm-cache
  warm-cache:
    <<: *builder
    profiles: ["warm"]
    environment:
      <<: *builder-environment
      WARM_MACHINES: ${WARM_MACHINES:-}
      WARM_TARGETS: ${WARM_TARGETS:-core-image-minimal}
      WARM_FETCH_TARGETS: ${WARM_FETCH_TARGETS:-router-dashboard-image}
    command: ["bash", "/opt/yocto/warm-cache.sh"]

volumes:
  yocto-cache:
    name: yocto-cache
  yocto-build:
    name: yocto-build
