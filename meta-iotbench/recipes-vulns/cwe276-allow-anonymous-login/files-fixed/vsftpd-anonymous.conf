# Restrictive maintenance access, anonymous login disabled.
listen=YES
listen_ipv6=NO
listen_port=21
background=NO
anonymous_enable=NO
no_anon_password=NO
ftp_username=ftp
anon_root=/var/lib/ftp
anon_world_readable_only=YES
local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO
dirlist_enable=YES
download_enable=YES
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
port_enable=NO
secure_chroot_dir=/var/run/vsftpd/empty
ftpd_banner=IoTBench maintenance FTP - anonymous access disabled
