# Lab image only. This systemd drop-in relaxes the upstream lighttpd sandbox so
# the dashboard command-injection PoC can write to the filesystem the way a real
# RCE would. It deliberately weakens the service; never ship it on a real device.
#
# Writes still run as the unprivileged "routerweb" user, so they succeed only
# where that user may write (/tmp, /var/tmp, /var/lib/router-dashboard), not in
# root-owned paths such as /home or /etc.
[Service]
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
MemoryDenyWriteExecute=no
