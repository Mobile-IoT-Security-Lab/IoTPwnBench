# Local synthetic fixture: no bridge, credentials or on-disk persistence.
per_listener_settings true
persistence false

# Public, read-only fixture interface in the isolated guest.
listener 1883 0.0.0.0
allow_anonymous true
acl_file /etc/mosquitto/iotbench-public.acl

# Only firmware-local publishers can reach this listener; never forward it.
listener 1884 127.0.0.1
allow_anonymous true
acl_file /etc/mosquitto/iotbench-publish.acl
