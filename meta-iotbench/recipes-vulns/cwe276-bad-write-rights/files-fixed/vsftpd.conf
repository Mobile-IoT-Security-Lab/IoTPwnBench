# Synthetic fixture, corrected variant. bad/ is not group writable, as the read-only policy requires.
listen=YES
listen_ipv6=NO
listen_address=127.0.0.1
listen_port=2121
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=077
local_root=/srv/iotbench-ftp
chroot_local_user=YES
allow_writeable_chroot=NO
secure_chroot_dir=/var/empty/vsftpd
nopriv_user=nobody
isolate_network=NO
check_shell=NO
pam_service_name=iotbench-ftp
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/iotbench/ftp-users
pasv_enable=YES
pasv_address=127.0.0.1
pasv_min_port=30100
pasv_max_port=30109
port_enable=NO
connect_from_port_20=NO
chmod_enable=NO
ls_recurse_enable=NO
# No CWD, CDUP, rename, mkdir, SITE or shell commands. All paths stay in the chroot.
cmds_allowed=USER,PASS,QUIT,PWD,TYPE,PASV,EPSV,LIST,NLST,RETR,STOR,DELE,NOOP,SYST,FEAT,OPTS
# The Yocto vsftpd filter canonicalizes / patterns, so /* also denies valid reads.
# Deny every parent-path spelling by substring; chroot contains absolute paths.
deny_file=..
seccomp_sandbox=YES
