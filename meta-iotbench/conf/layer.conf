BBPATH .= ":${LAYERDIR}"

# recipes-images holds one .bb per firmware directly; the other categories nest
# each recipe in its own directory.
BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "iotbench"
BBFILE_PATTERN_iotbench = "^${LAYERDIR}/"
BBFILE_PRIORITY_iotbench = "8"

LAYERDEPENDS_iotbench = "core openembedded-layer meta-openjdk"
LAYERSERIES_COMPAT_iotbench = "wrynose"

# Pin both Java tools and runtime. Only Java fixtures depend on these recipes.
PREFERRED_VERSION_openjdk = "17.%"
PREFERRED_VERSION_openjdk-bin-native = "17.%"
