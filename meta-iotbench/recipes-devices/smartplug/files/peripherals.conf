# Smart plug peripherals, simulated by iotbench-simd.
# Causal chain: relay -> power (load when on) -> current -> energy.
relay          binary    p01=0.10   p10=0.05  init=1
load_w         walk      unit=W     min=0     max=2300  init=180  mu=180  theta=0.05 step=60
power_w        derived   op=mul     a=relay   b=load_w  unit=W
voltage_v      walk      unit=V     min=228   max=242   init=230  mu=230  theta=0.2  step=0.6
current_a      derived   op=div     a=power_w b=voltage_v unit=A  max=16
energy_kwh     derived   op=integrate a=power_w k=3600000 unit=kWh init=12.4
load_temp      diurnal   unit=C     base=40   amp=8     noise=1.5 period=3600
