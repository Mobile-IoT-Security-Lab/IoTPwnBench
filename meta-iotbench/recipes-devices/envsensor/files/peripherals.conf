# Environmental / air-quality sensor peripherals.
temp_c        diurnal   unit=C     base=22 amp=4 noise=0.3 period=86400
humidity      walk      unit=%     min=25 max=75 init=48 mu=48 theta=0.1 step=2
co2_ppm       walk      unit=ppm   min=400 max=2000 init=600 mu=650 theta=0.05 step=40
pm25          walk      unit=ug/m3 min=0 max=150 init=12 mu=12 theta=0.08 step=4
pressure_hpa  walk      unit=hPa   min=980 max=1040 init=1013 mu=1013 theta=0.05 step=1
battery       walk      unit=%     min=0 max=100 init=88 mu=85 theta=0.01 step=0.3
