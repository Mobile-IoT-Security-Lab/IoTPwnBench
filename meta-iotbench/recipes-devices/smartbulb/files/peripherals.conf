# Smart bulb peripherals. watt is gated by the on/off state.
power_state   binary    p01=0.20 p10=0.10 init=1
brightness    walkint   unit=%   min=0 max=100 init=80 mu=80 theta=0.1 step=8
color_temp    walkint   unit=K   min=2700 max=6500 init=4000 mu=4000 theta=0.05 step=200
watt          derived   op=mul   a=power_state b=brightness unit=W
