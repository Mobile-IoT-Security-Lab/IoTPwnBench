# Industrial PLC gateway peripherals, simulated by iotbench-simd.
# flow only when the pump is running.
tank_level     walk      unit=%     min=0     max=100   init=62   step=1.5
pressure_bar   walk      unit=bar   min=0     max=10    init=4.2  step=0.2
pump           binary    p01=0.20   p10=0.10  init=1
flow_lpm       derived   op=gate    a=pump    k=140     unit=Lpm
valve          enum      states=open,closed,auto  p=0.05 init=2
motor_temp     diurnal   unit=C     base=58   amp=7     noise=1.5 period=3600
