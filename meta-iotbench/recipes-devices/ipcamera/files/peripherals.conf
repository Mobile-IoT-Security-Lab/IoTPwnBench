# IP camera peripherals, simulated by iotbench-simd.
# bitrate is correlated with the frame rate.
video_fps      walk      unit=fps   min=1    max=30    init=25   mu=25 theta=0.3 step=2
motion         binary    p01=0.15   p10=0.30 init=0
bitrate_kbps   derived   op=scale   a=video_fps k=200 unit=kbps
ir_night       binary    p01=0.02   p10=0.02 init=0
ptz_pan        walk      unit=deg   min=0    max=355   init=180  step=8
sensor_temp    diurnal   unit=C     base=46  amp=5     noise=1.2 period=3600
