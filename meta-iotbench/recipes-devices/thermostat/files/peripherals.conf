# Thermostat peripherals, simulated by iotbench-simd.
temp_c         diurnal   unit=C     base=21   amp=2     noise=0.3 period=86400
target_c       walkint   unit=C     min=18    max=24    init=21   step=0
humidity       walk      unit=%     min=30    max=60    init=45   step=2
hvac           enum      states=idle,heating,cooling  p=0.06 init=0
mode           enum      states=auto,heat,cool,off    p=0.02 init=0
