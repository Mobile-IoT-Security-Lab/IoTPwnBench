# Router device peripherals, simulated by iotbench-simd.
# Columns: <name> <type> key=value...   (see iotbench-simd.c for the model set)
wan_rx_rate   walk      unit=Mbps  min=0    max=940   init=120  step=30
wan_tx_rate   walk      unit=Mbps  min=0    max=340   init=45   step=15
lan_clients   walkint   unit=      min=1    max=48    init=9    step=1
wifi_rssi     walk      unit=dBm   min=-84  max=-38   init=-56  step=2.5
cpu_temp      diurnal   unit=C     base=54  amp=6     noise=1.5 period=3600
uplink        binary    p01=0.6    p10=0.01 init=1
