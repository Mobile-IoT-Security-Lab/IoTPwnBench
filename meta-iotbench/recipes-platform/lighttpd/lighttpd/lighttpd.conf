server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_cgi"
)

server.document-root = "/www/pages"
server.bind = "0.0.0.0"
server.port = 80
server.username = "routerweb"
server.groupname = "routerweb"
server.errorlog = "/var/lib/router-dashboard/lighttpd-error.log"
accesslog.filename = "/var/lib/router-dashboard/lighttpd-access.log"
server.upload-dirs = ( "/var/tmp" )

index-file.names = ( "index.php", "index.html" )
static-file.exclude-extensions = ( ".php", ".cgi" )
url.access-deny = ( "~", ".inc" )

# .php runs through php-cgi; .cgi scripts execute directly (e.g. the camera
# MJPEG stream). Stream CGI output so multipart/x-mixed-replace works.
cgi.assign = ( ".php" => "/usr/bin/php-cgi", ".cgi" => "" )
server.stream-response-body = 2

mimetype.assign = (
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".ico"  => "image/x-icon",
    ""      => "application/octet-stream"
)

# Firmware-specific packages may add isolated lighttpd configuration fragments.
# The command succeeds and emits nothing when no fragment is installed.
include_shell "cat /etc/lighttpd/conf.d/*.conf 2>/dev/null || true"
